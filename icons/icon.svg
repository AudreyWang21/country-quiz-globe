<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Atlas app icon: a compass rose on parchment -->
  <rect width="100" height="100" rx="16" fill="#f2e8d5"/>
  <rect x="4" y="4" width="92" height="92" rx="12" fill="none" stroke="#5b4636" stroke-width="1.5"/>
  <rect x="7.5" y="7.5" width="85" height="85" rx="9" fill="none" stroke="#5b4636" stroke-width="0.6"/>
  <circle cx="50" cy="50" r="34" fill="none" stroke="#5b4636" stroke-width="1.4"/>
  <circle cx="50" cy="50" r="29.5" fill="none" stroke="#5b4636" stroke-width="0.6"/>
  <!-- short intercardinal points (gold), rotated 45 degrees -->
  <g transform="rotate(45 50 50)" fill="#a8895a">
    <path d="M50 26 L53 47 L50 50 L47 47 Z"/>
    <path d="M74 50 L53 53 L50 50 L53 47 Z"/>
    <path d="M50 74 L47 53 L50 50 L53 53 Z"/>
    <path d="M26 50 L47 47 L50 50 L47 53 Z"/>
  </g>
  <!-- long cardinal points, each half ink / half gold -->
  <g>
    <path d="M50 14 L50 50 L45 45 Z" fill="#5b4636"/>
    <path d="M50 14 L50 50 L55 45 Z" fill="#a8895a"/>
    <path d="M86 50 L50 50 L55 45 Z" fill="#5b4636"/>
    <path d="M86 50 L50 50 L55 55 Z" fill="#a8895a"/>
    <path d="M50 86 L50 50 L55 55 Z" fill="#5b4636"/>
    <path d="M50 86 L50 50 L45 55 Z" fill="#a8895a"/>
    <path d="M14 50 L50 50 L45 55 Z" fill="#5b4636"/>
    <path d="M14 50 L50 50 L45 45 Z" fill="#a8895a"/>
  </g>
  <circle cx="50" cy="50" r="4" fill="#5b4636"/>
  <circle cx="50" cy="50" r="1.6" fill="#f2e8d5"/>
</svg>
